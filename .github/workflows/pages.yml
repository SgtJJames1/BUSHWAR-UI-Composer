name: Publish web edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare browser app
        run: |
          mkdir -p site/assets
          cp index.html app.js release-notes.js reforger-catalog.js reforger-bindings.js reforger-functions.js reforger-recipes.js reforger-widget-profiles.js styles.css site/
          cp assets/vanilla-gm-reference.png site/assets/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
